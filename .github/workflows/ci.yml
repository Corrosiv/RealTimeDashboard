name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RealTimeDashboard.sln

      - name: Build solution
        run: dotnet build RealTimeDashboard.sln --no-restore --configuration Debug

      - name: Run comprehensive test suite
        run: dotnet test test/RealTimeDashboard.Tests/RealTimeDashboard.Tests.csproj --no-build --configuration Debug --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Report test summary
        if: always()
        run: |
          echo "✅ Test suite complete. Check artifacts for detailed results."

      - name: Report vulnerable packages (informational)
        continue-on-error: true
        run: |
          echo "Checking vulnerable packages..."
          dotnet list package --vulnerable || echo "No vulnerable packages found"
